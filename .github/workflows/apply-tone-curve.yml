name: Apply grayscale tone curve

on:
  push:
    branches:
      - feature/midtone-adjustment
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/midtone-adjustment
          fetch-depth: 0
      - name: Replace gamma control with tone curve
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_tone_curve.py
          python /tmp/patch_tone_curve.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: add interactive grayscale tone curve"
          git push origin HEAD:feature/midtone-adjustment
