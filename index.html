<!doctype html>

<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stencil A4 Maker</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; padding: 16px; max-width: 800px; margin: 0 auto; background: #f5f5f5; }
    h3 { margin: 0 0 14px 0; font-size: 18px; }
    #dropZone {
      border: 3px dashed #aaa; border-radius: 14px; background: #fff;
      text-align: center; padding: 36px 20px; cursor: pointer;
      transition: border-color 0.2s, background 0.2s; margin-bottom: 16px;
    }
    #dropZone.over     { border-color: #0071e3; background: #e8f0ff; }
    #dropZone.has-file { border-color: #34c759; background: #f0fff4; }
    #dropZone .icon      { font-size: 48px; line-height: 1; margin-bottom: 8px; }
    #dropZone .main-text { font-size: 17px; font-weight: bold; color: #333; }
    #dropZone .sub-text  { font-size: 13px; color: #888; margin-top: 4px; }
    #fileInput { display: none; }
    .controls {
      display: flex; align-items: center; gap: 12px;
      background: #fff; border-radius: 12px; padding: 14px 16px;
      margin-bottom: 12px; flex-wrap: wrap;
    }
    .controls label { font-size: 15px; font-weight: bold; white-space: nowrap; }
    .controls input[type="number"] {
      width: 90px; padding: 10px; font-size: 20px; font-weight: bold;
      border: 2px solid #ccc; border-radius: 8px; text-align: center;
    }
    .controls input[type="number"]:focus { border-color: #0071e3; outline: none; }
    .controls .unit       { font-size: 16px; color: #555; }
    .controls .hint-small { font-size: 12px; color: #999; }
    #orientBtn {
      display: flex; align-items: center; gap: 8px;
      background: #fff; border-radius: 12px; padding: 12px 16px;
      margin-bottom: 12px; border: 2px solid #ddd; cursor: pointer;
      font-size: 15px; font-weight: bold; color: #333;
      transition: border-color 0.2s, background 0.2s; width: 100%;
    }
    #orientBtn:hover { border-color: #0071e3; }
    #orientBtn .icon-wrap { font-size: 28px; line-height: 1; transition: transform 0.3s ease; }
    #orientBtn.landscape .icon-wrap { transform: rotate(90deg); }
    #orientBtn.auto { border-color: #b8d7f6; background: #f7fbff; }
    #orientBtn .label-main { font-size: 15px; font-weight: bold; }
    #orientBtn .label-sub  { font-size: 12px; color: #888; margin-left: 4px; }
    .status { font-size: 13px; color: #555; margin-bottom: 12px; min-height: 18px; }
    .error  { color: #c00; }
    .output-section { display: none; flex-direction: column; gap: 20px; margin-top: 8px; }
    .output-card { background: #fff; border-radius: 12px; padding: 14px; border: 1px solid #ddd; }
    .output-card .card-title {
      font-size: 14px; font-weight: bold; color: #555;
      margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; color: #fff; white-space: nowrap; }
    .badge-main  { background: #0071e3; }
    .badge-small { background: #888; }
    .badge-large { background: #e35a00; }
    .output-card img { width: 100%; height: auto; border-radius: 6px; border: 1px solid #eee; }
    .output-card a {
      display: inline-block; margin-top: 10px; padding: 10px 20px; font-size: 14px;
      background: #34c759; color: #fff; border: none; border-radius: 8px;
      cursor: pointer; text-decoration: none;
    }
    .app-version { margin-top: 18px; text-align: right; font-size: 10px; color: #aaa; }
  </style>
</head>
<body>
  <h3>Stencil A4 Maker</h3>

  <div id="dropZone">
    <div class="icon">🖼️</div>
    <div class="main-text">画像をタップして選択</div>
    <div class="sub-text">またはここにドラッグ＆ドロップ</div>
  </div>
  <input id="fileInput" type="file" accept="image/*" />

  <div class="controls">
    <label for="baseCm">基準サイズ（長辺）</label>
    <input id="baseCm" type="number" inputmode="decimal" min="0.1" max="25" step="0.1" value="7" />
    <span class="unit">cm</span>
  </div>
  <div class="controls">
    <label for="stepCm">サイズの刻み幅</label>
    <input id="stepCm" type="number" inputmode="decimal" min="0.1" max="5" step="0.1" value="" placeholder="自動" />
    <span class="unit">cm</span>
    <span class="hint-small">空欄で自動（0.5 or 1cm）</span>
  </div>

  <button id="orientBtn" class="auto landscape">
    <span class="icon-wrap">📱</span>
    <span class="label-main" id="orientLabel">配置：自動（長辺：横）</span>
    <span class="label-sub">縦長画像は自動で横向きにします</span>
  </button>

  <p class="status" id="status">画像を選択すると自動で生成します</p>

  <div class="output-section" id="outputSection">
    <div class="output-card" id="card-main">
      <div class="card-title"><span class="badge badge-main">メイン</span><span id="label-main"></span></div>
      <img id="img-main" alt="main" />
      <a id="dl-main" download="stencil_main.png">💾 保存</a>
    </div>
    <div class="output-card" id="card-small">
      <div class="card-title"><span class="badge badge-small">小さいバージョン</span><span id="label-small"></span></div>
      <img id="img-small" alt="small" />
      <a id="dl-small" download="stencil_small.png">💾 保存</a>
    </div>
    <div class="output-card" id="card-large">
      <div class="card-title"><span class="badge badge-large">大きいバージョン</span><span id="label-large"></span></div>
      <img id="img-large" alt="large" />
      <a id="dl-large" download="stencil_large.png">💾 保存</a>
    </div>
  </div>

  <div class="app-version">v1</div>

  <script>
    'use strict';

    const DPI = 300;
    const SIZE_CORRECTION = 1.016; // 実測値に合わせて寸法を1.6%拡大
    const $id = (id) => document.getElementById(id);

    // --- 定数 ---
    function cmToPx(cm) { return (cm / 2.54) * DPI * SIZE_CORRECTION; }
    function mmToPx(mm) { return (mm / 25.4) * DPI; }
    const PAGE_W    = Math.round(mmToPx(192.75));
    const PAGE_H    = Math.round(mmToPx(276.87));
    const PAGE_PAD  = Math.round(mmToPx(3));       // ページ端の安全余白 3mm
    const RULER     = Math.round(cmToPx(0.24));    // 個別ルーラーの細い帯 2.4mm
    const RULER_GAP = Math.round(cmToPx(0.06));    // 画像とルーラーの間 0.6mm
    const GAP       = Math.round(cmToPx(0.20));    // 各画像ブロック間 2mm
    const CONTENT_W = PAGE_W - PAGE_PAD * 2;
    const CONTENT_H = PAGE_H - PAGE_PAD * 2;
    const MIN_CM    = 1.0;  // 最小サイズ（1cm未満は作らない）
    const MAX_COLS  = 4;    // 横に並べる最大枚数

    // --- UI ---
    let orientationMode = 'auto'; // auto → vertical → horizontal
    const orientBtn = $id('orientBtn');
    orientBtn.addEventListener('click', () => {
      orientationMode = orientationMode === 'auto'
        ? 'vertical'
        : orientationMode === 'vertical' ? 'horizontal' : 'auto';
      updateOrientBtn();
      if (currentDataURL) scheduleGenerate();
    });
    function updateOrientBtn() {
      orientBtn.classList.toggle('auto', orientationMode === 'auto');
      if (orientationMode === 'auto') {
        orientBtn.classList.add('landscape');
        $id('orientLabel').textContent = '配置：自動（長辺：横）';
        orientBtn.querySelector('.label-sub').textContent = '縦長画像は自動で横向きにします';
      } else if (orientationMode === 'vertical') {
        orientBtn.classList.remove('landscape');
        $id('orientLabel').textContent = '長辺：縦';
        orientBtn.querySelector('.label-sub').textContent = 'タップで長辺：横に切り替え';
      } else {
        orientBtn.classList.add('landscape');
        $id('orientLabel').textContent = '長辺：横';
        orientBtn.querySelector('.label-sub').textContent = 'タップで自動に戻す';
      }
    }

    const dropZone  = $id('dropZone');
    const fileInput = $id('fileInput');
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover',  (e) => { e.preventDefault(); dropZone.classList.add('over'); });
    dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault(); dropZone.classList.remove('over');
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) handleFile(f);
    });
    fileInput.addEventListener('change', () => { const f = fileInput.files[0]; if (f) handleFile(f); });
    $id('baseCm').addEventListener('input', () => { if (currentDataURL) scheduleGenerate(); });
    $id('stepCm').addEventListener('input',  () => { if (currentDataURL) scheduleGenerate(); });

    let currentDataURL = null, generateTimer = null, fileLoadId = 0;
    let currentWasCropped = false;

    function handleFile(file) {
      const loadId = ++fileLoadId;
      dropZone.classList.add('has-file');
      dropZone.querySelector('.main-text').textContent = file.name;
      dropZone.querySelector('.sub-text').textContent  = '余白を自動調整します';
      showStatus('読み込み・余白判定中…');
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const result = await autoCropDataURL(e.target.result);
          if (loadId !== fileLoadId) return;
          currentDataURL = result.dataURL;
          currentWasCropped = result.cropped;
          dropZone.querySelector('.sub-text').textContent = result.cropped
            ? '余白を自動トリミング済み・タップで画像変更'
            : '余白調整不要・タップで画像変更';
          scheduleGenerate();
        } catch (err) {
          if (loadId !== fileLoadId) return;
          console.warn('自動トリミングを省略しました', err);
          currentDataURL = e.target.result;
          currentWasCropped = false;
          dropZone.querySelector('.sub-text').textContent = '画像をそのまま使用・タップで画像変更';
          scheduleGenerate();
        }
      };
      reader.onerror = ()  => showStatus('ファイルの読み込みに失敗しました', true);
      reader.readAsDataURL(file);
    }

    function scheduleGenerate() {
      clearTimeout(generateTimer);
      generateTimer = setTimeout(generate, 300);
    }

    function showStatus(msg, isError = false) {
      const el = $id('status');
      el.textContent = msg;
      el.className = 'status' + (isError ? ' error' : '');
    }

    function loadImage(dataURL) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload  = () => resolve(img);
        img.onerror = () => reject(new Error('画像のデコードに失敗しました'));
        img.src = dataURL;
      });
    }

    /**
     * 四隅の色を背景色とみなし、大きな単色・透明余白を自動で除去する。
     * 内容を切り詰めないよう検出範囲の外側に1%の安全余白を残す。
     */
    async function autoCropDataURL(dataURL) {
      const img = await loadImage(dataURL);
      const maxSide = 1600;
      const analysisScale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const aw = Math.max(1, Math.round(img.naturalWidth * analysisScale));
      const ah = Math.max(1, Math.round(img.naturalHeight * analysisScale));
      const canvas = document.createElement('canvas');
      canvas.width = aw; canvas.height = ah;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, aw, ah);
      const pixels = ctx.getImageData(0, 0, aw, ah).data;

      // 透明ピクセルは白に合成してから比較する。
      const composite = (index, channel) => {
        const alpha = pixels[index + 3] / 255;
        return Math.round(pixels[index + channel] * alpha + 255 * (1 - alpha));
      };
      const samples = [[], [], []];
      const patch = Math.max(2, Math.min(24, Math.round(Math.min(aw, ah) * 0.025)));
      const corners = [[0, 0], [aw - patch, 0], [0, ah - patch], [aw - patch, ah - patch]];
      for (const [sx, sy] of corners) {
        for (let y = sy; y < sy + patch; y++) {
          for (let x = sx; x < sx + patch; x++) {
            const i = (y * aw + x) * 4;
            samples[0].push(composite(i, 0));
            samples[1].push(composite(i, 1));
            samples[2].push(composite(i, 2));
          }
        }
      }
      const median = (values) => {
        values.sort((a, b) => a - b);
        return values[Math.floor(values.length / 2)];
      };
      const bg = samples.map(median);
      const thresholdSq = 30 * 30;
      let minX = aw, minY = ah, maxX = -1, maxY = -1;
      for (let y = 0; y < ah; y++) {
        for (let x = 0; x < aw; x++) {
          const i = (y * aw + x) * 4;
          const dr = composite(i, 0) - bg[0];
          const dg = composite(i, 1) - bg[1];
          const db = composite(i, 2) - bg[2];
          if (dr * dr + dg * dg + db * db > thresholdSq) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (maxX < minX || maxY < minY) return { dataURL, cropped: false };
      const pad = Math.max(2, Math.round(Math.max(aw, ah) * 0.01));
      minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
      maxX = Math.min(aw - 1, maxX + pad); maxY = Math.min(ah - 1, maxY + pad);
      const cropW = maxX - minX + 1, cropH = maxY - minY + 1;
      if (cropW / aw > 0.97 && cropH / ah > 0.97) return { dataURL, cropped: false };

      const sourceX = Math.max(0, Math.floor(minX / analysisScale));
      const sourceY = Math.max(0, Math.floor(minY / analysisScale));
      const sourceW = Math.min(img.naturalWidth - sourceX, Math.ceil(cropW / analysisScale));
      const sourceH = Math.min(img.naturalHeight - sourceY, Math.ceil(cropH / analysisScale));
      const cropped = document.createElement('canvas');
      cropped.width = sourceW; cropped.height = sourceH;
      cropped.getContext('2d').drawImage(
        img, sourceX, sourceY, sourceW, sourceH, 0, 0, sourceW, sourceH
      );
      return { dataURL: cropped.toDataURL('image/png'), cropped: true };
    }

    function drawImageTransformed(ctx, img, x, y, w, h, rotate) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);
      if (rotate) ctx.rotate(Math.PI / 2);
      ctx.scale(-1, 1);
      const dw = rotate ? h : w;
      const dh = rotate ? w : h;
      ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
      ctx.restore();
    }

    function formatCm(value) {
      return `${value.toFixed(1)}cm`;
    }

    /** 画像ごとに、上と左へ細い0.5cm刻みの物差しを描く。 */
    function drawMiniRulers(ctx, x, y, w, h) {
      const tickLong = RULER * 0.58, tickShort = RULER * 0.34;
      const fontSize = Math.max(12, Math.round(cmToPx(0.18)));
      const horizontalY = y - RULER_GAP;
      const verticalX = x - RULER_GAP;
      const widthCm = w / cmToPx(1);
      const heightCm = h / cmToPx(1);

      ctx.save();
      ctx.strokeStyle = '#555'; ctx.fillStyle = '#444';
      ctx.lineWidth = Math.max(1, Math.round(mmToPx(0.12)));
      ctx.font = `${fontSize}px sans-serif`;

      // 上の物差し
      ctx.beginPath(); ctx.moveTo(x, horizontalY); ctx.lineTo(x + w, horizontalY); ctx.stroke();
      for (let d = 0; d <= widthCm + 0.001; d += 0.5) {
        const px = x + cmToPx(d);
        const major = Math.abs(d - Math.round(d)) < 0.01;
        ctx.beginPath();
        ctx.moveTo(px, horizontalY);
        ctx.lineTo(px, horizontalY - (major ? tickLong : tickShort));
        ctx.stroke();
      }

      // 左の物差し
      ctx.beginPath(); ctx.moveTo(verticalX, y); ctx.lineTo(verticalX, y + h); ctx.stroke();
      for (let d = 0; d <= heightCm + 0.001; d += 0.5) {
        const py = y + cmToPx(d);
        const major = Math.abs(d - Math.round(d)) < 0.01;
        ctx.beginPath();
        ctx.moveTo(verticalX, py);
        ctx.lineTo(verticalX - (major ? tickLong : tickShort), py);
        ctx.stroke();
      }

      // 実寸値は白抜きで読みやすくし、定規の帯を太くしない。
      const topLabel = formatCm(widthCm);
      const topWidth = ctx.measureText(topLabel).width;
      const topX = x + w / 2;
      const topY = horizontalY - fontSize * 0.2;
      ctx.fillStyle = '#fff';
      ctx.fillRect(topX - topWidth / 2 - 4, topY - fontSize, topWidth + 8, fontSize + 4);
      ctx.fillStyle = '#333'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(topLabel, topX, topY);

      const sideLabel = formatCm(heightCm);
      const sideWidth = ctx.measureText(sideLabel).width;
      const sideX = verticalX - fontSize * 0.2;
      const sideY = y + h / 2;
      ctx.save();
      ctx.translate(sideX, sideY); ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = '#fff';
      ctx.fillRect(-sideWidth / 2 - 4, -fontSize, sideWidth + 8, fontSize + 4);
      ctx.fillStyle = '#333'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(sideLabel, 0, 0);
      ctx.restore();
      ctx.restore();
    }

    // =====================================================
    // 核心ロジック：画像サイズ計算・ページ構成・描画
    // すべて同じ imgPx() 関数を使って一貫性を保証する
    // =====================================================

    // cm → {w, h} px  ※ effW/effH/longEdge を引数で受け取る
    function imgPx(cm, effW, effH, longEdge) {
      const s = cmToPx(cm) / longEdge;
      return { w: effW * s, h: effH * s };
    }

    /**
     * cmList を上から積み上げて「実際に描ける行リスト」を返す。
     * fits() の代わりにこれを唯一の判定・描画ソースとして使う。
     * 戻り値: [{ cm, w, h }, ...] （収まる行だけ）
     */
    function resolveRows(cmList, effW, effH, longEdge) {
      const rows = [];
      let usedH = 0;
      for (const cm of cmList) {
        const { w, h } = imgPx(cm, effW, effH, longEdge);
        const itemW = RULER + RULER_GAP + w;
        const itemH = RULER + RULER_GAP + h;
        const needed = usedH + itemH + (rows.length > 0 ? GAP : 0);
        if (needed > CONTENT_H || itemW > CONTENT_W) break;
        rows.push({ cm, w, h, itemW, itemH });
        usedH = needed;
      }
      return rows;
    }

    /**
     * ページに収まる最大のサイズリストを生成する。
     * anchor を中心に step 刻みで上下に広げる。
     * 1cm 未満は作らない。
     */
    function buildPageList(anchorCm, step, effW, effH, longEdge) {
      // まず anchor 単体が入るか確認
      const base = resolveRows([anchorCm], effW, effH, longEdge);
      if (base.length === 0) return [anchorCm]; // 入らなくても最低1種は返す

      const list = [anchorCm];

      // 上方向（大きい側）
      let up = Math.round((anchorCm + step) * 100) / 100;
      while (true) {
        const candidate = [...list, up].sort((a, b) => a - b);
        const rows = resolveRows(candidate, effW, effH, longEdge);
        if (rows.length < candidate.length) break; // 入りきらなかった
        list.push(up);
        up = Math.round((up + step) * 100) / 100;
      }

      // 下方向（小さい側）
      let down = Math.round((anchorCm - step) * 100) / 100;
      while (down >= MIN_CM) {
        const candidate = [...list, down].sort((a, b) => a - b);
        const rows = resolveRows(candidate, effW, effH, longEdge);
        if (rows.length < candidate.length) break;
        list.push(down);
        const next = Math.round((down - step) * 100) / 100;
        if (next < MIN_CM) break;
        down = next;
      }

      return list.sort((a, b) => a - b);
    }

    /**
     * startCm から下方向のみに拡張するページリスト。
     * 小さいバージョン用。
     */
    function buildPageListDown(startCm, step, effW, effH, longEdge) {
      const list = [];
      let cm = Math.round(startCm * 100) / 100;
      while (cm >= MIN_CM) {
        const candidate = [...list, cm].sort((a, b) => a - b);
        const rows = resolveRows(candidate, effW, effH, longEdge);
        if (rows.length < candidate.length) break;
        list.push(cm);
        const next = Math.round((cm - step) * 100) / 100;
        if (next < MIN_CM) break;
        cm = next;
      }
      return list.sort((a, b) => a - b);
    }

    /**
     * startCm から上方向のみに拡張するページリスト。
     * 大きいバージョン用。
     */
    function buildPageListUp(startCm, step, effW, effH, longEdge) {
      const list = [];
      let cm = Math.round(startCm * 100) / 100;
      while (true) {
        const candidate = [...list, cm].sort((a, b) => a - b);
        const rows = resolveRows(candidate, effW, effH, longEdge);
        if (rows.length < candidate.length) break;
        list.push(cm);
        cm = Math.round((cm + step) * 100) / 100;
      }
      return list.sort((a, b) => a - b);
    }

    /**
     * ステップ決定：
     * anchor を中心に 0.5cm 刻みで 4 種が 1 ページに収まるなら 0.5cm、
     * そうでなければ 1cm。
     */
    function calcStep(anchorCm, effW, effH, longEdge) {
      const half = Math.floor(4 / 2);
      const test = Array.from({ length: 4 }, (_, i) =>
        Math.max(MIN_CM, Math.round((anchorCm + (i - half) * 0.5) * 100) / 100)
      );
      const rows = resolveRows(test, effW, effH, longEdge);
      return rows.length >= 4 ? 0.5 : 1.0;
    }

    /**
     * cmList からキャンバスを生成して返す。
     * resolveRows() で実際に入る行だけを描画するので絶対に重ならない。
     */
    function buildCanvas(img, effW, effH, longEdge, rotate, cmList, baseCm) {
      const canvas = document.createElement('canvas');
      canvas.width  = PAGE_W;
      canvas.height = PAGE_H;
      const ctx = canvas.getContext('2d', { alpha: false });
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, PAGE_W, PAGE_H);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // resolveRows で実際に入る行だけ取得
      const rows = resolveRows(cmList, effW, effH, longEdge);
      if (rows.length === 0) return canvas;

      // 各行：入る枚数を自動計算し、行ごとに独立して中央配置する。
      let curY = PAGE_PAD;
      for (let row = 0; row < rows.length; row++) {
        const { w, h, itemW, itemH } = rows[row];
        const nCols = Math.max(1, Math.min(
          MAX_COLS,
          Math.floor((CONTENT_W + GAP) / (itemW + GAP))
        ));
        const totalRowW = itemW * nCols + GAP * (nCols - 1);
        const startX = PAGE_PAD + Math.floor((CONTENT_W - totalRowW) / 2);
        for (let col = 0; col < nCols; col++) {
          const itemX = startX + col * (itemW + GAP);
          const imageX = itemX + RULER + RULER_GAP;
          const imageY = curY + RULER + RULER_GAP;
          drawMiniRulers(ctx, imageX, imageY, w, h);
          drawImageTransformed(ctx, img, imageX, imageY, w, h, rotate);
        }
        curY += itemH;
        if (row < rows.length - 1) curY += GAP;
      }

      // 基準サイズ注記（右下・反転）
      const nfs = Math.max(10, Math.round(cmToPx(0.28)));
      ctx.save();
      ctx.font = `${nfs}px sans-serif`;
      ctx.textBaseline = 'bottom'; ctx.fillStyle = '#888';
      ctx.translate(PAGE_W - PAGE_PAD, PAGE_H - PAGE_PAD / 3);
      ctx.scale(-1, 1); ctx.textAlign = 'left';
      ctx.fillText(`基準 ${baseCm.toFixed(1)}cm`, 0, 0);
      ctx.restore();

      return canvas;
    }

    // =====================================================
    // メイン生成処理
    // =====================================================
    async function generate() {
      if (!currentDataURL) return;

      const baseCm = parseFloat($id('baseCm').value);
      if (!Number.isFinite(baseCm) || baseCm <= 0) {
        showStatus('基準サイズに正の数値を入力してください', true);
        return;
      }

      showStatus('生成中…');

      try {
        const img = await loadImage(currentDataURL);
        const iw = img.naturalWidth, ih = img.naturalHeight;
        if (iw === 0 || ih === 0) throw new Error('画像サイズが不正です');

        const isPortrait = ih > iw;
        const horizontalDoesNotFit = cmToPx(baseCm) + RULER + RULER_GAP > CONTENT_W;
        const longSideVertical = orientationMode === 'vertical'
          || (orientationMode === 'auto' && horizontalDoesNotFit);
        // 自動時は原則横長。横幅に収まらない大サイズだけ縦向きへ退避する。
        const rotate   = longSideVertical ? !isPortrait : isPortrait;
        const effW     = rotate ? ih : iw;
        const effH     = rotate ? iw : ih;
        const longEdge = Math.max(effW, effH);

        // ユーザー指定のステップがあればそれを使う、なければ自動判定
        const userStep = parseFloat($id('stepCm').value);
        const hasUserStep = Number.isFinite(userStep) && userStep > 0;

        // --- メイン ---
        const mainStep = hasUserStep ? userStep : calcStep(baseCm, effW, effH, longEdge);
        const mainCms  = buildPageList(baseCm, mainStep, effW, effH, longEdge);
        const mainMin  = Math.min(...mainCms);
        const mainMax  = Math.max(...mainCms);

        // --- 小さいバージョン ---
        // mainMin より小さいサイズから始める
        // そのページのアンカーサイズでステップを再計算
        const smallAnchor = Math.round((mainMin - mainStep) * 100) / 100;
        let smallCms = null;
        if (smallAnchor >= MIN_CM) {
          const smallStep = hasUserStep ? userStep : calcStep(smallAnchor, effW, effH, longEdge);
          // smallAnchor から下方向へ
          const start = Math.round(smallAnchor * 100) / 100;
          const list  = buildPageListDown(start, smallStep, effW, effH, longEdge);
          if (list.length > 0) smallCms = list;
        }

        // --- 大きいバージョン ---
        const largeAnchor = Math.round((mainMax + mainStep) * 100) / 100;
        const largeStep   = hasUserStep ? userStep : calcStep(largeAnchor, effW, effH, longEdge);
        const largeList   = buildPageListUp(largeAnchor, largeStep, effW, effH, longEdge);
        const largeCms    = largeList.length > 0 ? largeList : null;

        // --- 描画 ---
        const mainCanvas  = buildCanvas(img, effW, effH, longEdge, rotate, mainCms,  baseCm);
        const smallCanvas = smallCms ? buildCanvas(img, effW, effH, longEdge, rotate, smallCms, baseCm) : null;
        const largeCanvas = largeCms ? buildCanvas(img, effW, effH, longEdge, rotate, largeCms, baseCm) : null;

        // --- UI反映 ---
        function setCard(imgEl, dlEl, labelEl, canvas, sizes) {
          const card = imgEl.closest('.output-card');
          if (canvas && sizes && sizes.length > 0) {
            const url = canvas.toDataURL('image/png');
            imgEl.src = url; dlEl.href = url;
            card.style.display = 'block';
            labelEl.textContent = sizes.map(c => c.toFixed(1) + 'cm').join(' / ');
          } else {
            card.style.display = 'none';
          }
        }

        setCard($id('img-main'),  $id('dl-main'),  $id('label-main'),  mainCanvas,  mainCms);
        setCard($id('img-small'), $id('dl-small'), $id('label-small'), smallCanvas, smallCms);
        setCard($id('img-large'), $id('dl-large'), $id('label-large'), largeCanvas, largeCms);

        $id('outputSection').style.display = 'flex';

        const orientNote = orientationMode === 'auto'
          ? (longSideVertical
            ? '自動配置（大サイズのため長辺縦）'
            : `自動配置（${isPortrait ? '縦長を横向きに回転' : '横長のまま'}）`)
          : (longSideVertical ? '長辺縦' : '長辺横');
        const cropNote = currentWasCropped ? '・余白調整済み' : '';
        showStatus(`完了 — ${orientNote}${cropNote}　メイン(${mainStep.toFixed(1)}cm刻み): ${mainCms.map(c=>c.toFixed(1)+'cm').join('/')}`
          + (smallCms ? `　小: ${smallCms.map(c=>c.toFixed(1)+'cm').join('/')}` : '')
          + (largeCms ? `　大(${largeStep.toFixed(1)}cm刻み): ${largeCms.map(c=>c.toFixed(1)+'cm').join('/')}` : ''));

      } catch (err) {
        console.error(err);
        showStatus('エラー：' + (err.message || '生成に失敗しました'), true);
      }
    }
  </script>
