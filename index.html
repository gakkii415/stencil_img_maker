<!doctype html>

<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stencil A4 Maker</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; padding: 16px; max-width: 800px; margin: 0 auto; background: #f5f5f5; }
    h3 { margin: 0 0 14px 0; font-size: 18px; }
    #dropZone {
      border: 3px dashed #aaa; border-radius: 14px; background: #fff;
      text-align: center; padding: 36px 20px; cursor: pointer;
      transition: border-color 0.2s, background 0.2s; margin-bottom: 16px;
    }
    #dropZone.over     { border-color: #0071e3; background: #e8f0ff; }
    #dropZone.has-file { border-color: #34c759; background: #f0fff4; }
    #dropZone .icon      { font-size: 48px; line-height: 1; margin-bottom: 8px; }
    #dropZone .main-text { font-size: 17px; font-weight: bold; color: #333; }
    #dropZone .sub-text  { font-size: 13px; color: #888; margin-top: 4px; }
    #fileInput { display: none; }
    .controls {
      display: flex; align-items: center; gap: 12px;
      background: #fff; border-radius: 12px; padding: 14px 16px;
      margin-bottom: 12px; flex-wrap: wrap;
    }
    .controls label { font-size: 15px; font-weight: bold; white-space: nowrap; }
    .controls input[type="number"] {
      width: 90px; padding: 10px; font-size: 20px; font-weight: bold;
      border: 2px solid #ccc; border-radius: 8px; text-align: center;
    }
    .controls input[type="number"]:focus { border-color: #0071e3; outline: none; }
    .controls .unit       { font-size: 16px; color: #555; }
    .controls .hint-small { font-size: 12px; color: #999; }
    #orientBtn {
      display: flex; align-items: center; gap: 8px;
      background: #fff; border-radius: 12px; padding: 12px 16px;
      margin-bottom: 12px; border: 2px solid #ddd; cursor: pointer;
      font-size: 15px; font-weight: bold; color: #333;
      transition: border-color 0.2s, background 0.2s; width: 100%;
    }
    #orientBtn:hover { border-color: #0071e3; }
    #orientBtn .icon-wrap { font-size: 28px; line-height: 1; transition: transform 0.3s ease; }
    #orientBtn.landscape .icon-wrap { transform: rotate(90deg); }
    #orientBtn .label-main { font-size: 15px; font-weight: bold; }
    #orientBtn .label-sub  { font-size: 12px; color: #888; margin-left: 4px; }
    .status { font-size: 13px; color: #555; margin-bottom: 12px; min-height: 18px; }
    .error  { color: #c00; }
    .output-section { display: none; flex-direction: column; gap: 20px; margin-top: 8px; }
    .output-card { background: #fff; border-radius: 12px; padding: 14px; border: 1px solid #ddd; }
    .output-card .card-title {
      font-size: 14px; font-weight: bold; color: #555;
      margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; color: #fff; white-space: nowrap; }
    .badge-main  { background: #0071e3; }
    .badge-small { background: #888; }
    .badge-large { background: #e35a00; }
    .output-card img { width: 100%; height: auto; border-radius: 6px; border: 1px solid #eee; }
    .output-card a {
      display: inline-block; margin-top: 10px; padding: 10px 20px; font-size: 14px;
      background: #34c759; color: #fff; border: none; border-radius: 8px;
      cursor: pointer; text-decoration: none;
    }
  </style>
</head>
<body>
  <h3>Stencil A4 Maker</h3>

  <div id="dropZone">
    <div class="icon">🖼️</div>
    <div class="main-text">画像をタップして選択</div>
    <div class="sub-text">またはここにドラッグ＆ドロップ</div>
  </div>
  <input id="fileInput" type="file" accept="image/*" />

  <div class="controls">
    <label for="baseCm">基準サイズ（長辺）</label>
    <input id="baseCm" type="number" inputmode="decimal" min="0.1" max="25" step="0.1" value="7" />
    <span class="unit">cm</span>
    <span class="hint-small">変更すると自動で再生成します</span>
  </div>

  <button id="orientBtn">
    <span class="icon-wrap">📱</span>
    <span class="label-main" id="orientLabel">長辺：縦</span>
    <span class="label-sub">タップで横に切り替え</span>
  </button>

  <p class="status" id="status">画像を選択すると自動で生成します</p>

  <div class="output-section" id="outputSection">
    <div class="output-card" id="card-main">
      <div class="card-title"><span class="badge badge-main">メイン</span><span id="label-main"></span></div>
      <img id="img-main" alt="main" />
      <a id="dl-main" download="stencil_main.png">💾 保存</a>
    </div>
    <div class="output-card" id="card-small">
      <div class="card-title"><span class="badge badge-small">小さいバージョン</span><span id="label-small"></span></div>
      <img id="img-small" alt="small" />
      <a id="dl-small" download="stencil_small.png">💾 保存</a>
    </div>
    <div class="output-card" id="card-large">
      <div class="card-title"><span class="badge badge-large">大きいバージョン</span><span id="label-large"></span></div>
      <img id="img-large" alt="large" />
      <a id="dl-large" download="stencil_large.png">💾 保存</a>
    </div>
  </div>

  <script>
    'use strict';

    const DPI = 300;
    const $id = (id) => document.getElementById(id);

    // --- 定数 ---
    function cmToPx(cm) { return (cm / 2.54) * DPI; }
    function mmToPx(mm) { return (mm / 25.4) * DPI; }
    const PAGE_W    = Math.round(mmToPx(192.75));
    const PAGE_H    = Math.round(mmToPx(276.87));
    const RULER     = Math.round(cmToPx(1.0));   // ルーラー幅 10mm
    const GAP       = Math.round(cmToPx(0.5));   // 画像間 5mm
    const CONTENT_W = PAGE_W - RULER * 2;
    const CONTENT_H = PAGE_H - RULER * 2;
    const MIN_CM    = 1.0;  // 最小サイズ（1cm未満は作らない）
    const MAX_COLS  = 4;    // 横に並べる最大枚数

    // --- UI ---
    let longSideVertical = true;
    const orientBtn = $id('orientBtn');
    orientBtn.addEventListener('click', () => {
      longSideVertical = !longSideVertical;
      updateOrientBtn();
      if (currentDataURL) scheduleGenerate();
    });
    function updateOrientBtn() {
      if (longSideVertical) {
        orientBtn.classList.remove('landscape');
        $id('orientLabel').textContent = '長辺：縦';
        orientBtn.querySelector('.label-sub').textContent = 'タップで横に切り替え';
      } else {
        orientBtn.classList.add('landscape');
        $id('orientLabel').textContent = '長辺：横';
        orientBtn.querySelector('.label-sub').textContent = 'タップで縦に切り替え';
      }
    }

    const dropZone  = $id('dropZone');
    const fileInput = $id('fileInput');
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover',  (e) => { e.preventDefault(); dropZone.classList.add('over'); });
    dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault(); dropZone.classList.remove('over');
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) handleFile(f);
    });
    fileInput.addEventListener('change', () => { const f = fileInput.files[0]; if (f) handleFile(f); });
    $id('baseCm').addEventListener('input', () => { if (currentDataURL) scheduleGenerate(); });

    let currentDataURL = null, generateTimer = null;

    function handleFile(file) {
      dropZone.classList.add('has-file');
      dropZone.querySelector('.main-text').textContent = file.name;
      dropZone.querySelector('.sub-text').textContent  = '別の画像を選ぶにはタップ';
      showStatus('読み込み中…');
      const reader = new FileReader();
      reader.onload  = (e) => { currentDataURL = e.target.result; scheduleGenerate(); };
      reader.onerror = ()  => showStatus('ファイルの読み込みに失敗しました', true);
      reader.readAsDataURL(file);
    }

    function scheduleGenerate() {
      clearTimeout(generateTimer);
      generateTimer = setTimeout(generate, 300);
    }

    function showStatus(msg, isError = false) {
      const el = $id('status');
      el.textContent = msg;
      el.className = 'status' + (isError ? ' error' : '');
    }

    function loadImage(dataURL) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload  = () => resolve(img);
        img.onerror = () => reject(new Error('画像のデコードに失敗しました'));
        img.src = dataURL;
      });
    }

    function drawImageTransformed(ctx, img, x, y, w, h, rotate) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);
      if (rotate) ctx.rotate(Math.PI / 2);
      ctx.scale(-1, 1);
      const dw = rotate ? h : w;
      const dh = rotate ? w : h;
      ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
      ctx.restore();
    }

    function drawRulers(ctx) {
      const oneCm = cmToPx(1), halfCm = cmToPx(0.5);
      const tickL = RULER * 0.55, tickS = RULER * 0.30;
      const fs = Math.max(10, Math.round(RULER * 0.38));
      ctx.save();
      ctx.lineWidth = Math.max(1, Math.round(cmToPx(0.02)));
      ctx.font = `${fs}px sans-serif`;

      // 上ルーラー
      ctx.fillStyle = '#f0f0f0';
      ctx.fillRect(RULER, 0, CONTENT_W, RULER);
      ctx.strokeStyle = '#444'; ctx.fillStyle = '#444';
      ctx.beginPath(); ctx.moveTo(RULER, RULER); ctx.lineTo(RULER + CONTENT_W, RULER); ctx.stroke();
      for (let i = 0; i * oneCm <= CONTENT_W + 1; i++) {
        const x = RULER + i * oneCm;
        if (x > RULER + CONTENT_W + 1) break;
        ctx.beginPath(); ctx.moveTo(x, RULER); ctx.lineTo(x, RULER - tickL); ctx.stroke();
        if (i > 0) {
          ctx.save(); ctx.translate(x, RULER - tickL - fs * 0.1); ctx.scale(-1, 1);
          ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(String(i), 0, 0); ctx.restore();
        }
        const x5 = x + halfCm;
        if (x5 <= RULER + CONTENT_W) { ctx.beginPath(); ctx.moveTo(x5, RULER); ctx.lineTo(x5, RULER - tickS); ctx.stroke(); }
      }

      // 左ルーラー
      ctx.fillStyle = '#f0f0f0';
      ctx.fillRect(0, RULER, RULER, CONTENT_H);
      ctx.strokeStyle = '#444'; ctx.fillStyle = '#444';
      ctx.beginPath(); ctx.moveTo(RULER, RULER); ctx.lineTo(RULER, RULER + CONTENT_H); ctx.stroke();
      for (let i = 0; i * oneCm <= CONTENT_H + 1; i++) {
        const y = RULER + i * oneCm;
        if (y > RULER + CONTENT_H + 1) break;
        ctx.beginPath(); ctx.moveTo(RULER, y); ctx.lineTo(RULER - tickL, y); ctx.stroke();
        if (i > 0) {
          ctx.save(); ctx.translate(RULER - tickL - fs * 0.15, y); ctx.rotate(-Math.PI / 2);
          ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(String(i), 0, 0); ctx.restore();
        }
        const y5 = y + halfCm;
        if (y5 <= RULER + CONTENT_H) { ctx.beginPath(); ctx.moveTo(RULER, y5); ctx.lineTo(RULER - tickS, y5); ctx.stroke(); }
      }
      ctx.fillStyle = '#e0e0e0';
      ctx.fillRect(0, 0, RULER, RULER);
      ctx.restore();
    }

    // =====================================================
    // 核心ロジック：画像サイズ計算・ページ構成・描画
    // すべて同じ imgPx() 関数を使って一貫性を保証する
    // =====================================================

    // cm → {w, h} px  ※ effW/effH/longEdge を引数で受け取る
    function imgPx(cm, effW, effH, longEdge) {
      const s = cmToPx(cm) / longEdge;
      return { w: effW * s, h: effH * s };
    }

    /**
     * cmList を上から積み上げて「実際に描ける行リスト」を返す。
     * fits() の代わりにこれを唯一の判定・描画ソースとして使う。
     * 戻り値: [{ cm, w, h }, ...] （収まる行だけ）
     */
    function resolveRows(cmList, effW, effH, longEdge) {
      const rows = [];
      let usedH = 0;
      for (const cm of cmList) {
        const { w, h } = imgPx(cm, effW, effH, longEdge);
        const needed = usedH + h + (rows.length > 0 ? GAP : 0);
        if (needed > CONTENT_H) break;
        rows.push({ cm, w, h });
        usedH = needed;
      }
      return rows;
    }

    /**
     * ページに収まる最大のサイズリストを生成する。
     * anchor を中心に step 刻みで上下に広げる。
     * 1cm 未満は作らない。
     */
    function buildPageList(anchorCm, step, effW, effH, longEdge) {
      // まず anchor 単体が入るか確認
      const base = resolveRows([anchorCm], effW, effH, longEdge);
      if (base.length === 0) return [anchorCm]; // 入らなくても最低1種は返す

      const list = [anchorCm];

      // 上方向（大きい側）
      let up = Math.round((anchorCm + step) * 100) / 100;
      while (true) {
        const candidate = [...list, up].sort((a, b) => a - b);
        const rows = resolveRows(candidate, effW, effH, longEdge);
        if (rows.length < candidate.length) break; // 入りきらなかった
        list.push(up);
        up = Math.round((up + step) * 100) / 100;
      }

      // 下方向（小さい側）
      let down = Math.round((anchorCm - step) * 100) / 100;
      while (down >= MIN_CM) {
        const candidate = [...list, down].sort((a, b) => a - b);
        const rows = resolveRows(candidate, effW, effH, longEdge);
        if (rows.length < candidate.length) break;
        list.push(down);
        const next = Math.round((down - step) * 100) / 100;
        if (next < MIN_CM) break;
        down = next;
      }

      return list.sort((a, b) => a - b);
    }

    /**
     * startCm から下方向のみに拡張するページリスト。
     * 小さいバージョン用。
     */
    function buildPageListDown(startCm, step, effW, effH, longEdge) {
      const list = [];
      let cm = Math.round(startCm * 100) / 100;
      while (cm >= MIN_CM) {
        const candidate = [...list, cm].sort((a, b) => a - b);
        const rows = resolveRows(candidate, effW, effH, longEdge);
        if (rows.length < candidate.length) break;
        list.push(cm);
        const next = Math.round((cm - step) * 100) / 100;
        if (next < MIN_CM) break;
        cm = next;
      }
      return list.sort((a, b) => a - b);
    }

    /**
     * startCm から上方向のみに拡張するページリスト。
     * 大きいバージョン用。
     */
    function buildPageListUp(startCm, step, effW, effH, longEdge) {
      const list = [];
      let cm = Math.round(startCm * 100) / 100;
      while (true) {
        const candidate = [...list, cm].sort((a, b) => a - b);
        const rows = resolveRows(candidate, effW, effH, longEdge);
        if (rows.length < candidate.length) break;
        list.push(cm);
        cm = Math.round((cm + step) * 100) / 100;
      }
      return list.sort((a, b) => a - b);
    }

    /**
     * ステップ決定：
     * anchor を中心に 0.5cm 刻みで 4 種が 1 ページに収まるなら 0.5cm、
     * そうでなければ 1cm。
     */
    function calcStep(anchorCm, effW, effH, longEdge) {
      const half = Math.floor(4 / 2);
      const test = Array.from({ length: 4 }, (_, i) =>
        Math.max(MIN_CM, Math.round((anchorCm + (i - half) * 0.5) * 100) / 100)
      );
      const rows = resolveRows(test, effW, effH, longEdge);
      return rows.length >= 4 ? 0.5 : 1.0;
    }

    /**
     * cmList からキャンバスを生成して返す。
     * resolveRows() で実際に入る行だけを描画するので絶対に重ならない。
     */
    function buildCanvas(img, effW, effH, longEdge, rotate, cmList, baseCm) {
      const canvas = document.createElement('canvas');
      canvas.width  = PAGE_W;
      canvas.height = PAGE_H;
      const ctx = canvas.getContext('2d', { alpha: false });
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, PAGE_W, PAGE_H);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      drawRulers(ctx);

      // resolveRows で実際に入る行だけ取得
      const rows = resolveRows(cmList, effW, effH, longEdge);
      if (rows.length === 0) return canvas;

      // 各行の列数
      const nColsPerRow = rows.map(({ w }) =>
        Math.min(MAX_COLS, Math.max(1, Math.floor((CONTENT_W + GAP) / (w + GAP))))
      );
      const maxCols   = Math.max(...nColsPerRow);
      const gridUnitW = (CONTENT_W + GAP) / maxCols;

      let curY = RULER;
      for (let row = 0; row < rows.length; row++) {
        const { w, h } = rows[row];
        const nCols    = nColsPerRow[row];
        const colStart = Math.floor((maxCols - nCols) / 2);

        for (let col = 0; col < nCols; col++) {
          const gCol = colStart + col;
          const cx   = RULER + gCol * gridUnitW + gridUnitW / 2 - GAP / 2;
          drawImageTransformed(ctx, img, cx - w / 2, curY, w, h, rotate);
        }

        curY += h;
        if (row < rows.length - 1) curY += GAP;
      }

      // 基準サイズ注記（右下・反転）
      const nfs = Math.max(10, Math.round(cmToPx(0.28)));
      ctx.save();
      ctx.font = `${nfs}px sans-serif`;
      ctx.textBaseline = 'bottom'; ctx.fillStyle = '#888';
      ctx.translate(PAGE_W - RULER / 2, PAGE_H - RULER / 3);
      ctx.scale(-1, 1); ctx.textAlign = 'left';
      ctx.fillText(`基準 ${baseCm.toFixed(1)}cm`, 0, 0);
      ctx.restore();

      return canvas;
    }

    // =====================================================
    // メイン生成処理
    // =====================================================
    async function generate() {
      if (!currentDataURL) return;

      const baseCm = parseFloat($id('baseCm').value);
      if (!Number.isFinite(baseCm) || baseCm <= 0) {
        showStatus('基準サイズに正の数値を入力してください', true);
        return;
      }

      showStatus('生成中…');

      try {
        const img = await loadImage(currentDataURL);
        const iw = img.naturalWidth, ih = img.naturalHeight;
        if (iw === 0 || ih === 0) throw new Error('画像サイズが不正です');

        const isPortrait = ih >= iw;
        const rotate   = longSideVertical ? !isPortrait : isPortrait;
        const effW     = rotate ? ih : iw;
        const effH     = rotate ? iw : ih;
        const longEdge = Math.max(effW, effH);

        // --- メイン ---
        const mainStep = calcStep(baseCm, effW, effH, longEdge);
        const mainCms  = buildPageList(baseCm, mainStep, effW, effH, longEdge);
        const mainMin  = Math.min(...mainCms);
        const mainMax  = Math.max(...mainCms);

        // --- 小さいバージョン ---
        // mainMin より小さいサイズから始める
        // そのページのアンカーサイズでステップを再計算
        const smallAnchor = Math.round((mainMin - mainStep) * 100) / 100;
        let smallCms = null;
        if (smallAnchor >= MIN_CM) {
          const smallStep = calcStep(smallAnchor, effW, effH, longEdge);
          // smallAnchor から下方向へ
          const start = Math.round(smallAnchor * 100) / 100;
          const list  = buildPageListDown(start, smallStep, effW, effH, longEdge);
          if (list.length > 0) smallCms = list;
        }

        // --- 大きいバージョン ---
        const largeAnchor = Math.round((mainMax + mainStep) * 100) / 100;
        const largeStep   = calcStep(largeAnchor, effW, effH, longEdge);
        const largeList   = buildPageListUp(largeAnchor, largeStep, effW, effH, longEdge);
        const largeCms    = largeList.length > 0 ? largeList : null;

        // --- 描画 ---
        const mainCanvas  = buildCanvas(img, effW, effH, longEdge, rotate, mainCms,  baseCm);
        const smallCanvas = smallCms ? buildCanvas(img, effW, effH, longEdge, rotate, smallCms, baseCm) : null;
        const largeCanvas = largeCms ? buildCanvas(img, effW, effH, longEdge, rotate, largeCms, baseCm) : null;

        // --- UI反映 ---
        function setCard(imgEl, dlEl, labelEl, canvas, sizes) {
          const card = imgEl.closest('.output-card');
          if (canvas && sizes && sizes.length > 0) {
            const url = canvas.toDataURL('image/png');
            imgEl.src = url; dlEl.href = url;
            card.style.display = 'block';
            labelEl.textContent = sizes.map(c => c.toFixed(1) + 'cm').join(' / ');
          } else {
            card.style.display = 'none';
          }
        }

        setCard($id('img-main'),  $id('dl-main'),  $id('label-main'),  mainCanvas,  mainCms);
        setCard($id('img-small'), $id('dl-small'), $id('label-small'), smallCanvas, smallCms);
        setCard($id('img-large'), $id('dl-large'), $id('label-large'), largeCanvas, largeCms);

        $id('outputSection').style.display = 'flex';

        const orientNote = longSideVertical ? '長辺縦' : '長辺横';
        showStatus(`完了 — ${orientNote}　メイン(${mainStep===0.5?'0.5':'1'}cm刻み): ${mainCms.map(c=>c.toFixed(1)+'cm').join('/')}`
          + (smallCms ? `　小(${calcStep(Math.min(...smallCms),effW,effH,longEdge)===0.5?'0.5':'1'}cm刻み): ${smallCms.map(c=>c.toFixed(1)+'cm').join('/')}` : '')
          + (largeCms ? `　大(${largeStep===0.5?'0.5':'1'}cm刻み): ${largeCms.map(c=>c.toFixed(1)+'cm').join('/')}` : ''));

      } catch (err) {
        console.error(err);
        showStatus('エラー：' + (err.message || '生成に失敗しました'), true);
      }
    }
  </script>

</body>
</html>
